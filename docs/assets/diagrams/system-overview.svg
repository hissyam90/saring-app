<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 812" width="1000" height="812" role="img" aria-labelledby="diagTitle diagDesc" preserveAspectRatio="xMidYMid meet">
  <title id="diagTitle">Arsitektur Saring: pemeriksaan lokal di peramban, server Next.js, PostgreSQL, dan intelijen URL opsional</title>
  <desc id="diagDesc">Empat lapisan: browser menjalankan Unified Checker dan lib/analysis sepenuhnya lokal; server Next.js menangani autentikasi, API komunitas, moderasi admin, dan route /api/url-reputation dengan consent; PostgreSQL menyimpan akun, artikel, revisi, draf, bookmark, dan notifikasi; layanan eksternal hanya Google Safe Browsing (opsional, butuh API key), Cloudflare Turnstile, serta handoff manual ke sumber OJK.</desc>

  <style>
    text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;fill:#151b2b}
    .grp{fill:#ffffff;stroke:#151b2b;stroke-width:3}
    .hd{font-size:19px;font-weight:700;letter-spacing:.06em}
    .ttl{font-size:17px;font-weight:700;text-anchor:middle}
    .det{font-size:14px;text-anchor:middle;fill:#28334a}
    .note{font-size:13px;fill:#5b5b5b}
    .lg{font-size:14px;fill:#28334a}
    .flow{stroke:#151b2b;stroke-width:3;fill:none;marker-end:url(#arw)}
    .manual{stroke:#151b2b;stroke-width:3;fill:none;stroke-dasharray:9 7;marker-end:url(#arw)}
    .cap{font-size:12px;fill:#5b5b5b}
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#151b2b"/>
    </marker>
  </defs>

  <rect width="1000" height="812" fill="#f5f2ea"/>

  <text x="28" y="42" style="font-size:24px;font-weight:700">Arsitektur Saring</text>
  <text x="28" y="64" class="note">Pemeriksaan pesan, nomor, dan struktur tautan berjalan lokal di peramban; hanya reputasi URL yang dapat keluar ke server — dan itu pun sesudah consent.</text>

  <!-- 1. BROWSER -->
  <rect x="28" y="86" width="470" height="424" class="grp"/>
  <text x="48" y="116" class="hd">1 · BROWSER (KLIEN)</text>
  <line x1="28" y1="130" x2="498" y2="130" stroke="#151b2b" stroke-width="2"/>

  <rect x="48" y="144" width="430" height="46" fill="#eefbd0" stroke="#151b2b" stroke-width="2.5"/>
  <text x="263" y="173" class="ttl">Saring UI — App Router</text>

  <rect x="48" y="204" width="430" height="58" fill="#d8f36a" stroke="#151b2b" stroke-width="2.5"/>
  <text x="263" y="228" class="ttl">Unified Checker</text>
  <text x="263" y="249" class="det">Periksa Pesan · Nomor · Tautan</text>

  <rect x="48" y="282" width="430" height="82" fill="#ffffff" stroke="#151b2b" stroke-width="2.5"/>
  <text x="263" y="306" class="ttl">lib/analysis — murni, tanpa jaringan</text>
  <text x="263" y="328" class="det">analyzeText · inspectLink · normalizePhone</text>
  <text x="263" y="349" class="det">skor heuristik deterministik</text>

  <rect x="48" y="378" width="430" height="44" fill="#ffffff" stroke="#151b2b" stroke-width="2.5"/>
  <text x="263" y="406" class="ttl">Latihan · Langkah · Pustaka</text>

  <text x="48" y="448" class="note">Pesan dan struktur tautan tidak dikirim ke server.</text>
  <text x="48" y="468" class="note">Pilihan tema disimpan di localStorage peramban.</text>
  <text x="48" y="488" class="note">Tanpa analitik pihak ketiga dan tanpa layanan AI.</text>

  <!-- 2. SERVER -->
  <rect x="28" y="536" width="470" height="252" class="grp"/>
  <text x="48" y="566" class="hd">2 · SERVER NEXT.JS</text>
  <text x="478" y="566" text-anchor="end" class="cap">Node · Heroku</text>
  <line x1="28" y1="580" x2="498" y2="580" stroke="#151b2b" stroke-width="2"/>

  <rect x="48" y="594" width="430" height="52" fill="#fff3cf" stroke="#151b2b" stroke-width="2.5"/>
  <text x="263" y="616" class="ttl">POST /api/url-reputation</text>
  <text x="263" y="636" class="det">wajib consent = true · validasi URL · no-store</text>

  <rect x="48" y="660" width="430" height="52" fill="#ffffff" stroke="#151b2b" stroke-width="2.5"/>
  <text x="263" y="682" class="ttl">Autentikasi &amp; API komunitas</text>
  <text x="263" y="702" class="det">sesi cookie · CSRF · CAPTCHA · moderasi</text>

  <text x="48" y="734" class="note">Kredensial hanya di server: SESSION_SECRET, DATABASE_URL, API key.</text>
  <text x="48" y="754" class="note">Semua otorisasi diperiksa ulang di server, bukan dari cookie.</text>
  <text x="48" y="774" class="note">URL yang diperiksa tidak disimpan.</text>

  <!-- 3. DATABASE -->
  <rect x="536" y="86" width="416" height="150" class="grp"/>
  <text x="556" y="116" class="hd">3 · DATABASE</text>
  <line x1="536" y1="130" x2="952" y2="130" stroke="#151b2b" stroke-width="2"/>

  <rect x="556" y="144" width="376" height="66" fill="#fff3cf" stroke="#151b2b" stroke-width="2.5"/>
  <text x="744" y="170" class="ttl">Heroku Postgres</text>
  <text x="744" y="192" class="det">akun · artikel · revisi · draf · notifikasi</text>

  <!-- 4. EXTERNAL -->
  <rect x="536" y="256" width="416" height="180" class="grp"/>
  <text x="556" y="286" class="hd">4 · LAYANAN EKSTERNAL</text>
  <line x1="536" y1="300" x2="952" y2="300" stroke="#151b2b" stroke-width="2"/>

  <rect x="556" y="314" width="376" height="52" fill="#fff3cf" stroke="#151b2b" stroke-width="2.5"/>
  <text x="744" y="336" class="ttl">Google Safe Browsing</text>
  <text x="744" y="356" class="det">opsional · butuh API key</text>

  <rect x="556" y="376" width="376" height="52" fill="#ffffff" stroke="#151b2b" stroke-width="2.5"/>
  <text x="744" y="398" class="ttl">Cloudflare Turnstile</text>
  <text x="744" y="418" class="det">verifikasi CAPTCHA di server</text>

  <!-- STATUS -->
  <rect x="536" y="456" width="416" height="180" class="grp"/>
  <text x="556" y="486" class="hd">STATUS HASIL URL</text>
  <line x1="536" y1="500" x2="952" y2="500" stroke="#151b2b" stroke-width="2"/>

  <rect x="558" y="514" width="11" height="11" fill="#f16b5b" stroke="#151b2b" stroke-width="1.5"/>
  <text x="578" y="524" class="lg">threat — terdaftar di Safe Browsing</text>

  <rect x="558" y="540" width="11" height="11" fill="#e4f2ea" stroke="#151b2b" stroke-width="1.5"/>
  <text x="578" y="550" class="lg">no-match — bukan bukti aman</text>

  <rect x="558" y="566" width="11" height="11" fill="#fff3cf" stroke="#151b2b" stroke-width="1.5"/>
  <text x="578" y="576" class="lg">not-configured / unavailable</text>

  <rect x="558" y="592" width="11" height="11" fill="#d8d1c2" stroke="#151b2b" stroke-width="1.5"/>
  <text x="578" y="602" class="lg">invalid-response — respons tak valid</text>

  <text x="556" y="624" class="note">Kegagalan maupun no-match tidak ditampilkan sebagai “aman”.</text>

  <!-- LEGEND -->
  <rect x="536" y="656" width="416" height="132" class="grp"/>
  <text x="556" y="686" class="hd">LEGENDA</text>
  <line x1="536" y1="700" x2="952" y2="700" stroke="#151b2b" stroke-width="2"/>

  <rect x="558" y="714" width="22" height="14" fill="#d8f36a" stroke="#151b2b" stroke-width="2"/>
  <text x="590" y="726" class="lg">Komponen lokal di peramban</text>

  <rect x="558" y="738" width="22" height="14" fill="#fff3cf" stroke="#151b2b" stroke-width="2"/>
  <text x="590" y="750" class="lg">Komponen server / adapter</text>

  <line x1="556" y1="770" x2="582" y2="770" class="flow"/>
  <text x="590" y="775" class="lg">Aliran data otomatis</text>

  <!-- FLOWS -->
  <path d="M263 262 V280" class="flow"/>
  <text x="272" y="276" class="cap">lokal</text>

  <path d="M263 510 V534" class="flow"/>
  <text x="272" y="528" class="cap">consent</text>

  <!-- Server ke database (data akun, artikel, revisi, draf, notifikasi). -->
  <path d="M498 600 H516 V190 H536" class="flow"/>

  <!-- Server ke Google Safe Browsing, hanya setelah consent. -->
  <path d="M498 700 H528 V340 H556" class="flow"/>

  <!-- Respons kembali ke server. -->
  <path d="M932 356 H976 V802 H500" class="flow"/>
</svg>
